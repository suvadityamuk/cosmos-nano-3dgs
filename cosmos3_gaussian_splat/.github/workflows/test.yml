name: tests

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --extra test
      - run: uv run ruff check src tests jobs run_demo.py
      - run: uv run pytest
      - run: uv run python run_demo.py --help
